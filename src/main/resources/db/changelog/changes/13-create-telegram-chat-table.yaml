databaseChangeLog:
  - changeSet:
      id: create-telegram-chat-table
      author: acor
      changes:
        - createTable:
            tableName: telegram_chats
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: is_subscribed
                  type: bool
                  defaultValue: false
                  constraints:
                    nullable: false
