databaseChangeLog:
  - changeSet:
      id: create-address-table
      author: acor
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: street_line_one
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: street_line_two
                  type: varchar(64)
              - column:
                  name: postal_code
                  type: varchar(12)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: room_number
                  type: varchar(8)
              - column:
                  name: latitude
                  type: double
              - column:
                  name: longitude
                  type: double
